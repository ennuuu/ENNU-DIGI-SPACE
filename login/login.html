<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Windows XP Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="screen">
      <div class="glow"></div>
      <div class="topbar"></div>

      <div class="main">
        <div class="divider"></div>

        <div class="left-panel">
          <div class="logo">
            <span class="ms">Microsoft</span>
            <div class="wintitle">
              <div class="flag">
                <span></span><span></span><span></span><span></span>
              </div>
              <span class="wintext">Windows<sup>XP</sup></span>
            </div>
          </div>
          <div class="tagline">Choose your user name</div>
        </div>

        <div class="right-panel">
          <div class="user-row">
            <a
              class="avatar"
              href="../main/main.html"
              aria-label="Open ENNU portfolio"
            ></a>
            <div class="username">User</div>
          </div>
        </div>
      </div>

      <div class="bottombar">
        <div class="shutdown">
          <div class="icon"></div>
          <span>Turn off computer</span>
        </div>
        <div class="hint">
          After you log on, you can add or change accounts.<br />
          Just go to Control Panel and click User Accounts.
        </div>
      </div>
    </div>
  </body>
</html>
