<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ENNU | Login</title>
    <link
      rel="icon"
      type="image/png"
      href="../assets/Logo/favicon.png"
      sizes="128x128"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="screen" id="loginScreen">
      <video
        class="login-video"
        src="https://pub-9eb2f257de0c43e18c2f607494dda5b0.r2.dev/Bliss.mp4"
        autoplay
        muted
        loop
        playsinline
        aria-hidden="true"
      ></video>
      <div class="grid-overlay" id="gridOverlay" aria-hidden="true"></div>

      <div class="main">
        <div class="divider"></div>

        <div class="left-panel">
          <div class="logo">
            <img
              class="logo-image"
              src="../assets/Logo/LOGOTYPE.svg"
              alt="ENNU"
            />
          </div>
          <div class="tagline">Choose your user name</div>
        </div>

        <div class="right-panel">
          <div class="user-row">
            <a
              class="avatar"
              href="../main/main.html"
              aria-label="Open ENNU portfolio"
            >
              <img
                src="../assets/Backgrounds/Avatar.png"
                alt="User avatar"
                class="avatar-image"
              />
            </a>
            <a
              class="username"
              href="../main/main.html"
              aria-label="Open ENNU portfolio"
              >New User</a
            >
          </div>
        </div>
      </div>
    </div>
    <script src="login-grid.js"></script>
  </body>
</html>
